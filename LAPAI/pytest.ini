[pytest]
addopts = -ra --strict-markers --strict-config
python_files = test_*.py
python_functions = test_*
markers =
    stress: repeated/concurrent/property-heavy tests
    live: requires the real LAPAI backend/model runtime
    optional: test may be unavailable in a minimal environment
filterwarnings =
    error
    ignore::DeprecationWarning
xfail_strict = true
